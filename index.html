<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SZC Playground</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:16px;border-bottom:1px solid #29313a;position:sticky;top:0;background:#0b0d10;z-index:3}.brand{font-size:22px;font-weight:800}.sub{font-size:12px;color:#9aa6b2}
main{max-width:1250px;margin:auto;padding:12px;display:grid;grid-template-columns:1fr;gap:12px}.panel{border:1px solid #29313a;border-radius:16px;overflow:hidden;background:#12161b}.bar{padding:10px 12px;border-bottom:1px solid #29313a;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.actions{display:flex;gap:7px}button{border:0;border-radius:9px;padding:9px 13px;background:#5b8cff;color:white;font-weight:700}.secondary{background:#29313a}
textarea{display:block;width:100%;min-height:500px;resize:vertical;border:0;outline:0;background:#0e1115;color:#dfe7ef;padding:15px;font:14px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace}
iframe{display:block;width:100%;height:500px;border:0;background:white}.status{padding:8px 12px;border-top:1px solid #29313a;color:#9aa6b2;font-size:12px}
@media(min-width:850px){main{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="brand">SZC Playground</div><div class="sub">SZC 0.2 • Website + Styles + Links + Images + JavaScript</div></header>
<main>
<section class="panel"><div class="bar"><span>SZC Editor</span><div class="actions"><button id="run">▶ Run</button><button id="reset" class="secondary">Reset</button></div></div>
<textarea id="code" spellcheck="false">website is to

Create a website called "SZC Demo".
Set the page title to "SZC — English Programming".

Create a heading "Welcome to SZC".
Create a paragraph "Build websites using readable English."

Create a button "Open SZC".
The button should be 5 pixels from the left.
The button width should be 180 pixels.
The button height should be 50 pixels.

When the "Open SZC" button is clicked,
open "https://example.com".

Create a button "Show Image".
When the "Show Image" button is clicked,
show the image "https://picsum.photos/500/300".

Create a button "Show Video".
When the "Show Video" button is clicked,
show the video "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4".

styles is to

The page background color should be "#101318".
The heading text color should be white.
The heading should be centered.
The paragraph text color should be "#b9c3cf".
The button background color should be blue.
The button text color should be white.
The button corners should be rounded by 14 pixels.

links is to

Link "MDN" to "https://developer.mozilla.org".
Open external links in a new tab.

images is to

Image "Logo" is "https://picsum.photos/180/100".

javascript is to

When the page loads, write "SZC is running" to the console.</textarea>
<div class="status" id="status">Ready.</div></section>
<section class="panel"><div class="bar"><span>Live Preview</span></div><iframe id="preview" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe></section>
</main>
<script>
const code=document.getElementById('code'), frame=document.getElementById('preview'), status=document.getElementById('status'), initial=code.value;
const clean=s=>s.trim().replace(/[“”]/g,'"');
const quoted=s=>{let m=s.match(/"([\s\S]*?)"/);return m?m[1]:''};
function color(v){v=v.trim();return /^[#a-zA-Z0-9(),.%\\s-]+$/.test(v)?v:'#888'}
function parse(src){
 const lines=src.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 let mode='website', title='SZC Website', bg='#fff', body='', css=[], js=[], headLinks=[], assets=[], events=[], lastButton=null;
 function addButton(name){let id='szc_'+events.length+'_'+Math.random().toString(36).slice(2,6);lastButton={name,id};body+=`<button id="${id}" class="szc-button">${esc(name)}</button>`;return id}
 function esc(x){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 for(let i=0;i<lines.length;i++){
  let l=clean(lines[i]), m;
  if(l==='website is to'){mode='website';continue}
  if(l==='styles is to'){mode='styles';continue}
  if(l==='links is to'){mode='links';continue}
  if(l==='images is to'){mode='images';continue}
  if(l==='javascript is to'){mode='javascript';continue}
  if(mode==='website'){
   if(m=l.match(/^Create a website called "(.+?)"\.?$/i)) continue;
   if(m=l.match(/^Set the page title to "(.+?)"\.?$/i)){title=m[1];continue}
   if(m=l.match(/^Create a heading "(.+?)"\.?$/i)){body+=`<h1>${esc(m[1])}</h1>`;continue}
   if(m=l.match(/^Create a paragraph "(.+?)"\.?$/i)){body+=`<p>${esc(m[1])}</p>`;continue}
   if(m=l.match(/^Create a button "(.+?)"\.?$/i)){addButton(m[1]);continue}
   if(m=l.match(/^When the "(.+?)" button is clicked,$/i)){let action=lines[i+1]?clean(lines[++i]):'';let target=lastButton&&lastButton.name===m[1]?lastButton:null;
      if(!target) target={id:addButton(m[1])};
      if((m=action.match(/^open "(.+?)"\.?$/i))) events.push(`document.getElementById(${JSON.stringify(target.id)}).onclick=()=>window.open(${JSON.stringify(m[1])},'_blank','noopener');`);
      else if((m=action.match(/^show the image "(.+?)"\.?$/i))) events.push(`document.getElementById(${JSON.stringify(target.id)}).onclick=()=>showImage(${JSON.stringify(m[1])});`);
      else if((m=action.match(/^show the video "(.+?)"\.?$/i))) events.push(`document.getElementById(${JSON.stringify(target.id)}).onclick=()=>showVideo(${JSON.stringify(m[1])});`);
      else if((m=action.match(/^show an alert saying "(.+?)"\.?$/i))) events.push(`document.getElementById(${JSON.stringify(target.id)}).onclick=()=>alert(${JSON.stringify(m[1])});`);
      continue}
   if(m=l.match(/^The button should be (\d+) pixels from the left\.?$/i)) css.push(`#${lastButton?.id}{margin-left:${m[1]}px!important}`); 
   if(m=l.match(/^The button width should be (\d+) pixels\.?$/i)) css.push(`#${lastButton?.id}{width:${m[1]}px!important}`);
   if(m=l.match(/^The button height should be (\d+) pixels\.?$/i)) css.push(`#${lastButton?.id}{height:${m[1]}px!important}`);
  } else if(mode==='styles'){
   if(m=l.match(/^The page background color should be (.+?)\.?$/i)) bg=color(m[1]);
   else if(m=l.match(/^The heading text color should be (.+?)\.?$/i)) css.push(`h1{color:${color(m[1])}}`);
   else if(m=l.match(/^The heading should be centered\.?$/i)) css.push(`h1{text-align:center}`);
   else if(m=l.match(/^The paragraph text color should be (.+?)\.?$/i)) css.push(`p{color:${color(m[1])}`);
   else if(m=l.match(/^The button background color should be (.+?)\.?$/i)) css.push(`.szc-button{background:${color(m[1])}}`);
   else if(m=l.match(/^The button text color should be (.+?)\.?$/i)) css.push(`.szc-button{color:${color(m[1])}`);
   else if(m=l.match(/^The button corners should be rounded by (\d+) pixels\.?$/i)) css.push(`.szc-button{border-radius:${m[1]}px}`);
  } else if(mode==='links'){
   if(m=l.match(/^Link "(.+?)" to "(.+?)"\.?$/i)) body+=`<a class="szc-link" href="${esc(m[2])}" target="_blank" rel="noopener">${esc(m[1])}</a>`;
   if(/^Open external links in a new tab\.?$/i.test(l)) headLinks.push('newtab');
  } else if(mode==='images'){
   if(m=l.match(/^Image "(.+?)" is "(.+?)"\.?$/i)) body+=`<img alt="${esc(m[1])}" src="${esc(m[2])}" class="szc-image">`;
  } else if(mode==='javascript'){
   if(/^When the page loads, write "(.+?)" to the console\.?$/i.test(l)) js.push(`console.log(${JSON.stringify(quoted(l))});`);
  }
 }
 let common=`body{margin:0;padding:30px;font-family:system-ui,sans-serif;background:${bg};display:flex;flex-direction:column;align-items:center;gap:18px}.szc-button{border:0;padding:12px 20px;cursor:pointer;font-size:16px}.szc-link{display:inline-block}.szc-image{max-width:100%;height:auto;border-radius:12px}`;
 let runtime=`function showImage(u){let o=document.getElementById('szcOverlay');o.innerHTML='<div class="overlay"><button class="close" onclick="this.parentElement.parentElement.remove()">Close</button><img src="'+u.replace(/"/g,'&quot;')+'"></div>';document.body.appendChild(o)} function showVideo(u){let o=document.getElementById('szcOverlay');o.innerHTML='<div class="overlay"><button class="close" onclick="this.parentElement.parentElement.remove()">Close</button><video src="'+u.replace(/"/g,'&quot;')+'" controls autoplay></video></div>';document.body.appendChild(o)} window.addEventListener('load',()=>{${js.join('\\n')}});${events.join('\\n')}`;
 return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>${common}${css.join('')} .overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9999}.overlay img,.overlay video{max-width:90%;max-height:85%;background:#111}.close{position:fixed;top:20px;right:20px;padding:10px 15px;z-index:10000}</style></head><body>${body}<div id="szcOverlay"></div><script>${runtime.replace(/<\/script/gi,'<\\\\/script')}<\/script></body></html>`;
}
function run(){try{frame.srcdoc=parse(code.value);status.textContent='SZC compiled successfully • Website, styles, links, images and JavaScript loaded.'}catch(e){status.textContent='SZC error: '+e.message}}
document.getElementById('run').onclick=run;document.getElementById('reset').onclick=()=>{code.value=initial;run()};run();
</script>
</body></html>
